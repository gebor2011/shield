<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Shield AI — AI-powered due diligence for serious investors</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-color: #0F111A; 
            --card-bg: #161A26;
            --text-main: #F5F6FA; 
            --text-muted: #8E96A7;
            --primary: #00D2FF; 
            --primary-glow: rgba(0, 210, 255, 0.15);
            --accent: #00E676; 
            --accent-glow: rgba(0, 230, 118, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 80px 0 40px 0;
            text-align: center;
            background: radial-gradient(circle at top, rgba(0, 210, 255, 0.12) 0%, transparent 70%);
        }

        .logo-box {
            width: 100px;
            height: 100px;
            background-color: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 18px;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .logo-box span {
            font-size: 38px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        h1 {
            font-size: 54px;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #FFFFFF 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slogan {
            font-size: 20px;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .section-title {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin: 50px 0 40px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #FFFFFF;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .price-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 35px 22px;
            text-align: left;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .price-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        .price-card.vip {
            border: 2px solid var(--accent);
            background: linear-gradient(180deg, #161A26 0%, #11221A 100%);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .price-card.vip:hover {
            box-shadow: 0 20px 45px rgba(0, 230, 118, 0.25);
        }

        .vip-badge {
            position: absolute;
            top: -13px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #0F111A;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 18px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-icon {
            font-size: 36px;
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
        }

        .price-card.vip .card-icon {
            color: var(--accent);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 15px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .meta-info {
            font-size: 14px;
            margin-bottom: 12px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .meta-info strong {
            color: var(--primary);
        }
        
        .price-card.vip .meta-info strong {
            color: var(--accent);
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .card-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .card-list li {
            font-size: 13.5px;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.4;
        }

        .card-list li i {
            color: var(--primary);
            margin-top: 3px;
            font-size: 11px;
        }

        .price-card.vip .card-list li i {
            color: var(--accent);
        }

        .formula-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 15px;
            font-size: 13px;
            color: #FFFFFF;
            border-left: 3px solid var(--accent);
            margin-bottom: 20px;
            font-style: italic;
            line-height: 1.4;
        }

        .card-price {
            font-size: 48px;
            font-weight: 800;
            color: #FFFFFF;
            margin-top: auto;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: -1px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 15px 20px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            color: #FFFFFF;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .price-card:hover .btn-action {
            background: transparent;
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .price-card.vip .btn-action {
            background: linear-gradient(135deg, var(--accent) 0%, #00C853 100%);
            border: none;
            color: #0F111A;
            box-shadow: 0 5px 20px rgba(0, 230, 118, 0.3);
        }

        .price-card.vip:hover .btn-action {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 230, 118, 0.4);
        }

        .reputation-banner {
            background: linear-gradient(135deg, #161A26 0%, #0F111A 100%);
            border-left: 4px solid var(--primary);
            padding: 40px;
            border-radius: 0 16px 16px 0;
            text-align: left;
            margin: 40px 0 60px 0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .reputation-banner h3 {
            font-size: 26px;
            color: #FFFFFF;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .reputation-banner p {
            color: var(--text-muted);
            font-size: 17px;
        }

        .disclaimer-section {
            background-color: rgba(22, 26, 38, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 25px;
            margin-top: 60px;
            text-align: left;
        }

        .disclaimer-section h4 {
            font-size: 15px;
            color: #FFFFFF;
            margin-bottom: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .disclaimer-section p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        footer {
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            margin-top: 40px;
        }

        footer p {
            font-size: 14px;
            color: var(--text-muted);
        }

        @media (max-width: 992px) {
            .pricing-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            header { padding: 50px 0 30px 0; }
            h1 { font-size: 36px; }
            .slogan { font-size: 16px; }
            .section-title { font-size: 24px; margin-bottom: 30px; }
            .pricing-grid { grid-template-columns: 1fr; max-width: 400px; margin: 0 auto; }
            .reputation-banner { padding: 25px; margin: 40px 0; }
            .reputation-banner h3 { font-size: 20px; }
