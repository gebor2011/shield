<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фирменный Баннер Capital Shield AI</title>
    <style>
        body {
            background-color: #05070B;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #F5F6FA;
        }
        /* Рекламный баннер 1:1 (Квадрат 600x600) */
        .banner-card {
            width: 600px;
            height: 600px;
            background-color: #0F111A;
            border: 2px solid #161A26;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            background: radial-gradient(circle at center, #1A2235 0%, #0F111A 70%);
            overflow: hidden;
        }
        /* Декоративные кибер-линии */
        .banner-card::before {
            content: ''; position: absolute; width: 150%; height: 1px;
            background: linear-gradient(90deg, transparent, #00D2FF, transparent);
            top: 25%; transform: rotate(-15deg); opacity: 0.15;
        }
        .banner-card::after {
            content: ''; position: absolute; width: 150%; height: 1px;
            background: linear-gradient(90deg, transparent, #00E676, transparent);
            bottom: 30%; transform: rotate(20deg); opacity: 0.1;
        }
        /* Объемный 3D щит-монограмма */
        .shield-logo {
            width: 140px;
            height: 140px;
            background: #161A26;
            border: 3px solid #00D2FF;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.3), inset 0 0 20px rgba(0, 210, 255, 0.1);
            margin-bottom: 40px;
            position: relative;
        }
        .shield-logo span {
            font-size: 54px;
            font-weight: 900;
            color: #F5F6FA;
            letter-spacing: -2px;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }
        /* Текстовые блоки */
        .brand-name {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #FFFFFF 40%, #00D2FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-slogan {
            font-size: 15px;
            color: #8E96A7;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            max-width: 80%;
            line-height: 1.4;
        }
        .accent-bar {
            position: absolute;
            bottom: 40px;
            font-size: 12px;
            font-weight: 700;
            color: #00E676;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.6;
        }
        .info-text {
            margin-top: 25px;
            font-size: 14px;
            color: #8E96A7;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Сам баннер -->
    <div class="banner-card">
        <div class="shield-logo">
            <span>CS</span>
        </div>
        <div class="brand-name">Capital Shield AI</div>
        <div class="brand-slogan">AI-powered due diligence<br>for serious investors</div>
        <div class="accent-bar">Shield Active</div>
    </div>

    <div class="info-text">
        <p>Инструкция: Откройте страницу на телефоне или компьютере, сделайте скриншот квадратной карточки<br>или используйте инструмент «Ножницы», чтобы сохранить чистый баннер для постов.</p>
    </div>

</body>
</html>
